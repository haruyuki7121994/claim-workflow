spring.application.name=claimworkflow
spring.config.import=classpath:workflow.yaml
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/claimworkflow}
spring.datasource.username=${DATABASE_USER:claimworkflow}
spring.datasource.password=${DATABASE_PASSWORD:claimworkflow_local}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.web.error.include-message=never
app.jwt.secret=${JWT_SECRET:local-development-signing-key-at-least-32-bytes}
app.jwt.issuer=${JWT_ISSUER:claimworkflow}
app.jwt.audience=claimworkflow-api
app.outbox.enabled=true
app.outbox.delay-ms=1000
app.outbox.max-attempts=5
app.outbox.lease-seconds=60
app.outbox.retry-seconds=5
